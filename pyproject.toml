[project]
name = "CRAG"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chardet>=7.4.3",
    "langchain>=0.3.0",
    "ollama>=0.3.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "transformers>=4.44.0,<5.0.0",
    "torch==2.7.1+cu128",
    "rank-bm25>=0.2.2",
    "ddgs>=9.14.4",
    "langgraph>=1.2.4",
    "flagembedding>=1.4.0",
    "ragas>=0.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "prometheus-client>=0.25.0",
    "langfuse>=2.0,<3.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
